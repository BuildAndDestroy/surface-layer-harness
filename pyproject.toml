[project]
name = "surface-harness"
version = "0.1.0"
description = "Attack surface discovery harness: seeds -> related domains -> subdomains -> DNS -> HTTP/ports -> report"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "tldextract>=5.1",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.optional-dependencies]
graphql = ["strawberry-graphql[asgi]>=0.240", "uvicorn>=0.30"]
dev = ["pytest>=8", "strawberry-graphql[asgi]>=0.240", "uvicorn>=0.30"]

[project.scripts]
surface-harness = "surface_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["surface_harness*"]

[tool.setuptools.package-data]
surface_harness = ["data/*.txt"]
